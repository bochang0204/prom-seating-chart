<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舞會座位排定系統 (智慧吸附版)</title>
    <style>
        :root {
            --btn-blue: #3498db;
            --btn-pink: #f192b3;
            --btn-yellow: #f1c40f;
            --table-color: #f39c12;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f5f6fa;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 左側控制面板 */
        #control-panel {
            width: 240px;
            background-color: #2c3e50;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 10;
            box-sizing: border-box;
            overflow-y: auto; /* 避免螢幕太小塞不下 */
        }

        .panel-title {
            color: #ecf0f1;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        /* 設定區域 */
        .config-section {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            color: #ecf0f1;
        }

        .config-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .config-group:last-child { margin-bottom: 0; }

        .config-group label { font-size: 13px; }
        .config-group input {
            width: 60px;
            padding: 4px;
            border-radius: 4px;
            border: none;
            text-align: center;
            font-weight: bold;
        }

        .config-btn {
            width: 100%;
            padding: 6px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        .config-btn:hover { background-color: #d35400; }

        /* 按鈕群組 */
        .btn-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .add-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .add-btn:active { transform: scale(0.95); }
        .btn-label { color: #bdc3c7; font-size: 12px; font-weight: bold; }

        #btn-blue { background-color: var(--btn-blue); }
        #btn-pink { background-color: var(--btn-pink); }
        #btn-yellow { background-color: var(--btn-yellow); color: #34495e; }

        /* 計數器面板 */
        #counter-panel {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            color: #ecf0f1;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .counter-item { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .counter-item:last-child {
            margin-bottom: 0; padding-top: 4px;
            border-top: 1px dashed rgba(255,255,255,0.3);
            font-weight: bold; color: #fff;
        }

        /* 垃圾桶 */
        #trash-can {
            width: 110px;
            height: 80px;
            background-color: #e74c3c;
            color: white;
            border-radius: 10px;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        #trash-can.hover { background-color: #c0392b; transform: scale(1.05); }
        #trash-icon { font-size: 22px; margin-bottom: 2px; }

        /* 右側主畫面 */
        #canvas {
            flex-grow: 1;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
            background-color: #f5f6fa;
        }

        /* 桌面容器網格配置 */
        #tables-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 預設三欄，會依桌數自動優化 */
            gap: 40px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        /* 大圓圈（餐桌外框，現在包含虛線座位） */
        .table-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .large-table {
            border: 4px solid var(--table-color);
            background-color: rgba(243, 156, 18, 0.05);
            border-radius: 50%;
            width: 55%; /* 調小實體桌面，讓周圍留給座位孔 */
            aspect-ratio: 1 / 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: inset 0 0 15px rgba(243, 156, 18, 0.1);
        }

        .table-label {
            color: #e67e22;
            font-size: 1.4rem;
            font-weight: bold;
        }

        /* 座位空槽（灰圈圈） */
        .seat-slot {
            width: 52px;
            height: 52px;
            border: 2px dashed #bdc3c7;
            background-color: rgba(255,255,255,0.7);
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 5;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .seat-slot.occupied {
            border: none;
            background-color: transparent;
        }

        /* 人員小圓圈 */
        .person-node {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            position: absolute;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.25);
            user-select: none;
            z-index: 100;
            padding: 4px;
            box-sizing: border-box;
            text-align: center;
            word-break: break-all;
            line-height: 1.2;
        }
        .person-node.parent { color: #2c3e50; }
    </style>
</head>
<body>

    <div id="control-panel">
        <div class="panel-title">舞會座位控制</div>
        
        <div class="config-section">
            <div class="config-group">
                <label for="input-tables">總桌數：</label>
                <input type="number" id="input-tables" min="1" max="12" value="5">
            </div>
            <div class="config-group">
                <label for="input-seats">每桌人數：</label>
                <input type="number" id="input-seats" min="2" max="20" value="10">
            </div>
            <button class="config-btn" id="btn-rebuild">重新產生桌椅</button>
        </div>

        <div class="btn-container">
            <div class="btn-group">
                <button id="btn-blue" class="add-btn" title="新增男生">+</button>
                <span class="btn-label">男生</span>
            </div>
            <div class="btn-group">
                <button id="btn-pink" class="add-btn" title="新增女生">+</button>
                <span class="btn-label">女生</span>
            </div>
            <div class="btn-group">
                <button id="btn-yellow" class="add-btn" title="新增家長">+</button>
                <span class="btn-label">家長</span>
            </div>
        </div>

        <div id="counter-panel">
            <div class="counter-item"><span>男生人數：</span><span id="count-boy">0</span></div>
            <div class="counter-item"><span>女生人數：</span><span id="count-girl">0</span></div>
            <div class="counter-item"><span>家長人數：</span><span id="count-parent">0</span></div>
            <div class="counter-item"><span>目前總計：</span><span id="count-total">0</span></div>
        </div>
        
        <div id="trash-can">
            <span id="trash-icon">🗑️</span>
            <span>拖曳至此刪除</span>
        </div>
    </div>

    <div id="canvas">
        <div id="tables-container"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const container = document.getElementById('tables-container');
        const trashCan = document.getElementById('trash-can');
        
        let activeNode = null;
        let offsetX = 0;
        let offsetY = 0;
        const counts = { boy: 0, girl: 0, parent: 0 };

        // 初始化與重構桌椅
        function rebuildCanvas() {
            // 清空舊的桌子（但保留自由移動的人員圈圈）
            container.innerHTML = '';
            
            const totalTables = parseInt(document.getElementById('input-tables').value) || 5;
            const seatsPerTable = parseInt(document.getElementById('input-seats').value) || 10;

            // 動態根據桌數調整排版網格
            if (totalTables <= 2) container.style.gridTemplateColumns = 'repeat(2, 1fr)';
            else if (totalTables <= 4) container.style.gridTemplateColumns = 'repeat(2, 1fr)';
            else container.style.gridTemplateColumns = 'repeat(3, 1fr)';

            // 產生各桌
            for (let i = 0; i < totalTables; i++) {
                const tableName = String.fromCharCode(65 + i) + " 桌"; // A, B, C...
                
                const wrapper = document.createElement('div');
                wrapper.className = 'table-wrapper';
                
                const table = document.createElement('div');
                table.className = 'large-table';
                table.innerHTML = `<span class="table-label">${tableName}</span>`;
                wrapper.appendChild(table);
                container.appendChild(wrapper);
            }

            // 必須等桌子渲染好後，再動態去計算並定位座位空槽 (Slot)
            setTimeout(() => {
                const wrappers = document.querySelectorAll('.table-wrapper');
                wrappers.forEach((wrapper) => {
                    const rect = wrapper.getBoundingClientRect();
                    const canvasRect = canvas.getBoundingClientRect();
                    
                    // 找出 wrapper 的中心點（相對於右側 canvas）
                    const centerX = rect.left - canvasRect.left + rect.width / 2;
                    const centerY = rect.top - canvasRect.top + rect.height / 2;
                    
                    // 根據每桌人數，用數學三角函數繞圓圈畫出座位孔
                    const radius = Math.min(rect.width, rect.height) * 0.38; // 座位環繞半徑
                    
                    for (let s = 0; s < seatsPerTable; s++) {
                        const angle = (s * 2 * Math.PI) / seatsPerTable - Math.PI / 2; // 從正上方開始繞
                        const slotX = centerX + radius * Math.cos(angle);
                        const slotY = centerY + radius * Math.sin(angle);
                        
                        const slot = document.createElement('div');
                        slot.className = 'seat-slot';
                        slot.style.left = `${slotX}px`;
                        slot.style.top = `${slotY}px`;
                        canvas.appendChild(slot);
                    }
                });
            }, 100);
        }

        // 綁定事件
        document.getElementById('btn-blue').addEventListener('click', () => createNode('#3498db', 'boy'));
        document.getElementById('btn-pink').addEventListener('click', () => createNode('#f192b3', 'girl'));
        document.getElementById('btn-yellow').addEventListener('click', () => createNode('#f1c40f', 'parent'));
        document.getElementById('btn-rebuild').addEventListener('click', () => {
            if(confirm("重構桌椅會重新安排畫面結構，建議先清除或退回所有人，是否繼續？")) {
                // 清除所有舊座位孔
                document.querySelectorAll('.seat-slot').forEach(s => s.remove());
                rebuildCanvas();
            }
        });

        function updateCounterDisplay() {
            document.getElementById('count-boy').innerText = counts.boy;
            document.getElementById('count-girl').innerText = counts.girl;
            document.getElementById('count-parent').innerText = counts.parent;
            document.getElementById('count-total').innerText = counts.boy + counts.girl + counts.parent;
        }

        function createNode(color, type) {
            let typeChinese = type === 'boy' ? '男生' : (type === 'girl' ? '女生' : '家長');
            const name = prompt(`請輸入【${typeChinese}】的姓名或代號：`, "");
            if (name === null) return; 

            const node = document.createElement('div');
            node.className = 'person-node';
            if (type === 'parent') node.classList.add('parent');
            node.style.backgroundColor = color;
            node.innerText = name || "未命名";
            node.dataset.type = type;

            // 初始在左上角生成
            node.style.left = '30px';
            node.style.top = '30px';

            node.addEventListener('mousedown', startDrag);
            canvas.appendChild(node);

            counts[type]++;
            updateCounterDisplay();
        }

        function startDrag(e) {
            activeNode = e.target;
            const rect = activeNode.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            activeNode.style.zIndex = 1000;

            // 如果原本占用了某個座位，鬆開解除佔用狀態
            if (activeNode.dataset.occupiedSlotId) {
                const oldSlot = document.getElementById(activeNode.dataset.occupiedSlotId);
                if (oldSlot) oldSlot.classList.remove('occupied');
                delete activeNode.dataset.occupiedSlotId;
            }

            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', endDrag);
        }

        function drag(e) {
            if (!activeNode) return;

            const canvasRect = canvas.getBoundingClientRect();
            let x = e.clientX - canvasRect.left - offsetX;
            let y = e.clientY - canvasRect.top - offsetY;

            x = Math.max(0, Math.min(x, canvasRect.width - activeNode.offsetWidth));
            y = Math.max(0, Math.min(y, canvasRect.height - activeNode.offsetHeight));

            activeNode.style.left = `${x}px`;
            activeNode.style.top = `${y}px`;

            // 垃圾桶碰撞視覺反饋
            const trashRect = trashCan.getBoundingClientRect();
            if (e.clientX >= trashRect.left && e.clientX <= trashRect.right &&
                e.clientY >= trashRect.top && e.clientY <= trashRect.bottom) {
                trashCan.classList.add('hover');
            } else {
                trashCan.classList.remove('hover');
            }
        }

        function endDrag(e) {
            if (!activeNode) return;

            const trashRect = trashCan.getBoundingClientRect();
            
            // 1. 判斷是否刪除
            if (e.clientX >= trashRect.left && e.clientX <= trashRect.right &&
                e.clientY >= trashRect.top && e.clientY <= trashRect.bottom) {
                const type = activeNode.dataset.type;
                counts[type]--;
                activeNode.remove();
                updateCounterDisplay();
                trashCan.classList.remove('hover');
                activeNode = null;
                return;
            }

            // 2. 智慧磁吸邏輯：遍歷所有座位孔，找尋最近且未被佔用的孔
            const slots = document.querySelectorAll('.seat-slot:not(.occupied)');
            let closestSlot = null;
            let minDistance = 35; // 磁吸感應範圍（像素），靠近 35px 內會自動吸入

            const nodeRect = activeNode.getBoundingClientRect();
            const nodeCenterX = nodeRect.left + nodeRect.width / 2;
            const nodeCenterY = rectToCenterY = nodeRect.top + nodeRect.height / 2;

            slots.forEach((slot, index) => {
                const slotRect = slot.getBoundingClientRect();
                const slotCenterX = slotRect.left + slotRect.width / 2;
                const slotCenterY = slotRect.top + slotRect.height / 2;

                // 畢氏定理計算距離 $$d = \sqrt{\Delta x^2 + \Delta y^2}$$
                const distance = Math.sqrt(Math.pow(nodeCenterX - slotCenterX, 2) + Math.pow(nodeCenterY - slotCenterY, 2));
                
                if (distance < minDistance) {
                    minDistance = distance;
                    closestSlot = slot;
                }
            });

            // 如果找到夠近的座位孔，就精準吸附過去
            if (closestSlot) {
                const canvasRect = canvas.getBoundingClientRect();
                const slotRect = closestSlot.getBoundingClientRect();
                
                // 將人員精確定位到空孔的正中心
                const finalX = slotRect.left - canvasRect.left;
                const finalY = slotRect.top - canvasRect.top;

                activeNode.style.left = `${finalX}px`;
                activeNode.style.top = `${finalY}px`;

                // 標記該座位孔已被佔用
                closestSlot.classList.add('occupied');
                // 給這個座位孔一個臨時ID，方便人員下次被移走時釋放孔位
                if (!closestSlot.id) closestSlot.id = 'slot-' + Date.now() + '-' + Math.random();
                activeNode.dataset.occupiedSlotId = closestSlot.id;
            }

            activeNode.style.zIndex = 100;
            trashCan.classList.remove('hover');
            activeNode = null;
            
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', endDrag);
        }

        // 首次載入執行
        rebuildCanvas();
        
        // 當視窗縮放時重新計算座位孔位置
        window.addEventListener('resize', () => {
            document.querySelectorAll('.seat-slot').forEach(s => s.remove());
            rebuildCanvas();
        });
    </script>
</body>
</html>
